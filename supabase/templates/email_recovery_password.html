<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contrase&ntilde;a - VIMDY</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0f; color:#e0e0e0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; margin:0 auto; padding:40px 20px;">
    <tr>
      <td style="text-align:center; padding-bottom:24px;">
        <svg width="120" height="120" viewBox="0 0 100 100" style="display:block; margin:0 auto;">
          <defs>
            <linearGradient id="vimdy-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#141417"/>
              <stop offset="100%" stop-color="#0A0A0C"/>
            </linearGradient>
            <linearGradient id="vimdy-stroke" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#2563EB"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="97" height="97" rx="24" fill="url(#vimdy-bg)" stroke="#27272F" stroke-width="1.5"/>
          <path d="M30 30 L50 66 L70 30" fill="none" stroke="url(#vimdy-stroke)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </td>
    </tr>
    <tr>
      <td style="background:rgba(15,15,25,0.8); border:1px solid rgba(0,163,255,0.2); border-radius:12px; padding:32px; text-align:center;">
        <h1 style="color:#ffffff; font-size:20px; font-weight:600; margin:0 0 16px;">Recuperar contrase&ntilde;a</h1>
        <p style="color:#a0a0b0; font-size:15px; line-height:1.6; margin:0 0 24px;">Recibimos una solicitud para restablecer la contrase&ntilde;a de tu cuenta de VIMDY.</p>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="text-align:center;">
               <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:linear-gradient(135deg, #00a3ff 0%, #0066cc 100%); color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; padding:14px 32px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); transition:all 0.2s;" class="button-link">Actualizar mi contrase&ntilde;a</a>
            </td>
          </tr>
        </table>
        <p style="color:#a0a0b0; font-size:13px; line-height:1.6; margin:24px 0 0;">Si no solicitaste este cambio, puedes ignorar este correo con seguridad.</p>
        <p style="color:#a0a0b0; font-size:13px; line-height:1.6; margin:8px 0 0;">El enlace expira en 10 minutos.</p>
      </td>
    </tr>
    <tr>
      <td style="text-align:center; padding-top:24px;">
        <p style="color:#606070; font-size:12px; line-height:1.4; margin:0;">VIMDY © {{ .GeneratedAt }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
