name: VIMDY — Simulacro semanal de restauración

# El corazón de la Fase 3.5 #4: no basta con que el backup se genere, hay
# que PROBAR cada semana que sirve de verdad. Corre en una base de datos
# Postgres efímera creada solo para este job (services.postgres) — nunca
# toca producción ni el backup original.
on:
  schedule:
    - cron: "0 7 * * 0"   # todos los domingos 07:00 UTC
  workflow_dispatch: {}

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: restoretest
          POSTGRES_DB: vimdy_restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg

      - name: Configurar AWS CLI (o compatible S3)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.BACKUP_S3_REGION || 'us-east-1' }}

      - name: Ejecutar restore + verificación
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          STORAGE_BACKEND: s3
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          RESTORE_DB_URL: postgresql://postgres:restoretest@localhost:5432/vimdy_restore_drill
          WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: ./scripts/backup/restore_and_verify.sh

      # Si este job queda en rojo, GitHub ya te manda email automáticamente
      # a quien lo activó/es dueño del repo — es una segunda red de alerta
      # independiente del webhook, en caso de que el webhook mismo falle.