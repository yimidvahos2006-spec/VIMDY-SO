name: VIMDY — Chequeo de salud del sistema

# Llama a la Edge Function ops-health-check cada 15 minutos. Si encuentra
# errores en racha o pagos atascados, ella misma manda la alerta por
# webhook — este workflow solo la dispara.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a ops-health-check
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${SUPABASE_PROJECT_URL}/functions/v1/ops-health-check" \
            -H "x-ops-secret: ${OPS_SECRET}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "ops-health-check respondió HTTP ${status}"
            exit 1
          fi